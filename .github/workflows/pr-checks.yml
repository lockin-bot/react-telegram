name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  changeset:
    name: Check Changeset
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Check for changeset
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "Skipping changeset check for dependabot"
            exit 0
          fi
          
          npx changeset status --since=origin/main

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Build packages
        run: |
          bun run build:core
          bun run build:adapter
          
      - name: Check bundle sizes
        run: |
          echo "Core package size:"
          du -sh packages/core/dist/
          echo ""
          echo "Adapter package size:"
          du -sh packages/mtcute-adapter/dist/
          
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Check formatting
        run: |
          npx prettier --check "packages/*/src/**/*.{ts,tsx}"